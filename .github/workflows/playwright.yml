name: Playwright E2E

# ─────────────────────────────────────────────────────────────────────────────
# TRIGGERS
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:

      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, uat, prod]

      browser:
        description: 'Browser to run tests on'
        required: false
        default: 'chromium'
        type: choice
        options: [chromium, firefox, webkit]

      test-suite:
        description: 'Grep filter — tag or keyword (e.g. @smoke). Blank = all tests'
        required: false
        default: ''
        type: string

      shard-count:
        description: 'Number of parallel shards (2–8)'
        required: false
        default: '4'
        type: choice
        options: ['2', '4', '6', '8']

      retries:
        description: 'Retries per failed test'
        required: false
        default: '1'
        type: choice
        options: ['0', '1', '2', '3']

      workers:
        description: 'Parallel workers per shard (blank = Playwright default)'
        required: false
        default: ''
        type: string

      timeout:
        description: 'Test timeout in ms'
        required: false
        default: '30000'
        type: choice
        options: ['15000', '30000', '60000', '120000']

      headed:
        description: 'Run in headed mode (visible browser)'
        required: false
        default: false
        type: boolean

      upload-artifacts:
        description: 'Upload traces/screenshots on failure'
        required: false
        default: true
        type: boolean

      report:
        description: 'Deploy merged report to GitHub Pages'
        required: false
        default: 'true'
        type: boolean

      notify-slack:
        description: 'Send Slack notification on completion'
        required: false
        default: true
        type: boolean

# ─────────────────────────────────────────────────────────────────────────────
# GLOBAL
# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: playwright-${{ github.ref }}-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

env:
  CI: true
  # Resolved once here — used by both jobs below
  ENVIRONMENT:   ${{ github.event.inputs.environment  || 'dev' }}
  BROWSER:       ${{ github.event.inputs.browser       || 'chromium' }}
  RETRIES:       ${{ github.event.inputs.retries        || '1' }}
  TIMEOUT:       ${{ github.event.inputs.timeout        || '30000' }}
  SHARD_TOTAL:   ${{ github.event.inputs.shard-count   || '4' }}
  NOTIFY_SLACK:  ${{ github.event.inputs.notify-slack  || 'true' }}

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Sharded test execution
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  e2e-tests:
    name: E2E · Shard ${{ matrix.shard }}/${{ github.event.inputs.shard-count || '4' }}
    runs-on: ubuntu-latest

    # Environment-scoped secrets (BASE_URL, credentials live here)
    environment: ${{ github.event.inputs.environment || 'dev' }}

    strategy:
      fail-fast: false   # All shards must finish — partial data breaks the merge
      matrix:
        shard: [1, 2, 3, 4]

    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host --user 1001

    steps:
      - uses: actions/checkout@v4

      - name: Cache npm store
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests · shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }}
        env:
          # ── URLs & credentials from environment-scoped GitHub secrets ────────
          BASE_URL:        ${{ secrets.BASE_URL }}
          MAGENTO_URL:     ${{ secrets.MAGENTO_URL }}
          STRAPI_URL:      ${{ secrets.STRAPI_URL }}
          AUTH_USERNAME:   ${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD:   ${{ secrets.AUTH_PASSWORD }}
          HTTP_USERNAME:   ${{ secrets.HTTP_USERNAME }}
          HTTP_PASSWORD:   ${{ secrets.HTTP_PASSWORD }}
        run: |
          set -euo pipefail

          args=(
            --reporter=blob
            --shard="${{ matrix.shard }}/${{ env.SHARD_TOTAL }}"
            --project="${{ env.BROWSER }}"
            --retries="${{ env.RETRIES }}"
            --timeout="${{ env.TIMEOUT }}"
          )

          # Optional: headed mode
          if [ "${{ github.event.inputs.headed }}" = "true" ]; then
            args+=(--headed)
          fi

          # Optional: worker count
          WORKERS="${{ github.event.inputs.workers }}"
          if [ -n "$WORKERS" ] && [ "$WORKERS" != "0" ]; then
            args+=(--workers="$WORKERS")
          fi

          # Optional: grep filter
          TEST_SUITE="${{ github.event.inputs.test-suite }}"
          if [ -n "$TEST_SUITE" ]; then
            args+=(--grep="$TEST_SUITE")
          fi

          npx playwright test "${args[@]}"

      - name: Upload blob report · shard ${{ matrix.shard }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1   # Intermediate — only needed until merge job runs

      - name: Upload traces & screenshots on failure
        if: >
          failure() &&
          (github.event.inputs.upload-artifacts == '' ||
           github.event.inputs.upload-artifacts == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — Merge reports
# ─────────────────────────────────────────────────────────────────────────────
  merge-report:
    name: Merge reports
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Cache npm store
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: all-blob-reports/

      - name: Merge blob reports → HTML report
        run: |
          npx playwright merge-reports \
            --reporter html \
            ./all-blob-reports

      - name: Merge blob reports → JSON (stdout capture)
        run: |
          npx playwright merge-reports \
            --reporter json \
            ./all-blob-reports > playwright-report/results.json

      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ env.ENVIRONMENT }}
          path: playwright-report/
          retention-days: 14

      - name: Configure GitHub Pages
        run: |
          mkdir -p _site
          cp -r playwright-report/* _site/

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — Deploy to GitHub Pages
# ─────────────────────────────────────────────────────────────────────────────
  deploy-pages:
    name: Deploy report to GitHub Pages
    runs-on: ubuntu-latest
    needs: [merge-report]
    if: always() && github.ref == 'refs/heads/slack' && (github.event_name != 'workflow_dispatch' || github.event.inputs.report == 'true')
    environment:
      name: github-pages

    steps:
      - uses: actions/deploy-pages@v4

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4 — Notify Slack
# ─────────────────────────────────────────────────────────────────────────────
  notify-slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [merge-report, deploy-pages]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download results.json from merge-report artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report-${{ env.ENVIRONMENT }}
          path: playwright-report/

      - name: Parse test results
        id: results
        if: always()
        run: |
          set -euo pipefail
          FILE="playwright-report/results.json"

          if [ ! -f "$FILE" ]; then
            echo "⚠️  results.json not found — defaulting all counts to 0"
            {
              echo "passed=0"
              echo "failed=0"
              echo "skipped=0"
              echo "total=0"
              echo "duration=0s"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PASSED=$(jq  '.stats.expected   // 0'                    "$FILE")
          FAILED=$(jq  '.stats.unexpected // 0'                    "$FILE")
          SKIPPED=$(jq '.stats.skipped    // 0'                    "$FILE")
          TOTAL=$(jq   '(.stats.expected + .stats.unexpected + .stats.skipped) // 0' "$FILE")
          DURATION=$(jq '((.stats.duration // 0) / 1000 | round | tostring) + "s"'  "$FILE" | tr -d '"')

          {
            echo "passed=$PASSED"
            echo "failed=$FAILED"
            echo "skipped=$SKIPPED"
            echo "total=$TOTAL"
            echo "duration=$DURATION"
          } >> "$GITHUB_OUTPUT"

          echo "✅ Passed=$PASSED ❌ Failed=$FAILED ⏭ Skipped=$SKIPPED ⏱ $DURATION"

      - name: Build pass/fail bar chart
        id: chart
        if: always()
        run: |
          PASSED=${{ steps.results.outputs.passed }}
          FAILED=${{ steps.results.outputs.failed }}
          SKIPPED=${{ steps.results.outputs.skipped }}
          TOTAL=${{ steps.results.outputs.total }}

          BAR_WIDTH=20
          if [ "$TOTAL" -gt 0 ]; then
            PASS_BARS=$(( PASSED  * BAR_WIDTH / TOTAL ))
            FAIL_BARS=$(( FAILED  * BAR_WIDTH / TOTAL ))
            SKIP_BARS=$(( BAR_WIDTH - PASS_BARS - FAIL_BARS ))
          else
            PASS_BARS=0; FAIL_BARS=0; SKIP_BARS=$BAR_WIDTH
          fi

          CHART=""
          for _ in $(seq 1 $PASS_BARS); do CHART="${CHART}🟩"; done
          for _ in $(seq 1 $FAIL_BARS); do CHART="${CHART}🟥"; done
          for _ in $(seq 1 $SKIP_BARS); do CHART="${CHART}⬜"; done

          echo "bar=$CHART" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: >
          always() &&
          (env.NOTIFY_SLACK == 'true') &&
          (needs.merge-report.result != 'cancelled')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          PASSED="${{ steps.results.outputs.passed }}"
          FAILED="${{ steps.results.outputs.failed }}"
          SKIPPED="${{ steps.results.outputs.skipped }}"
          TOTAL="${{ steps.results.outputs.total }}"
          DURATION="${{ steps.results.outputs.duration }}"
          CHART="${{ steps.chart.outputs.bar }}"
          OVERALL="${{ needs.merge-report.result }}"
          ENV="${{ env.ENVIRONMENT }}"
          BROWSER="${{ env.BROWSER }}"
          BRANCH="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EVENT="${{ github.event_name }}"
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

          if [ "$FAILED" = "0" ] && [ "$OVERALL" = "success" ]; then
            HEADER="✅ E2E Passed — ${ENV}"
            BUTTON_STYLE="primary"
          else
            HEADER="❌ E2E Failed — ${ENV}"
            BUTTON_STYLE="danger"
          fi

          # jq builds the payload safely — no manual JSON escaping of variables
          PAYLOAD=$(jq -n \
            --arg header   "$HEADER" \
            --arg chart    "$CHART" \
            --arg passed   "$PASSED" \
            --arg failed   "$FAILED" \
            --arg skipped  "$SKIPPED" \
            --arg total    "$TOTAL" \
            --arg duration "$DURATION" \
            --arg env      "$ENV" \
            --arg browser  "$BROWSER" \
            --arg branch   "$BRANCH" \
            --arg actor    "$ACTOR" \
            --arg event    "$EVENT" \
            --arg shards   "${{ env.SHARD_TOTAL }}" \
            --arg run_url  "$RUN_URL" \
            --arg pages_url "$PAGES_URL" \
            --arg btn_style "$BUTTON_STYLE" \
            '{
              blocks: [
                {
                  type: "header",
                  text: { type: "plain_text", text: $header, emoji: true }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("```" + $chart + "```\n🟩 Passed  🟥 Failed  ⬜ Skipped")
                  }
                },
                {
                  type: "section",
                  fields: [
                    { type: "mrkdwn", text: ("*✅ Passed*\n" + $passed + " / " + $total) },
                    { type: "mrkdwn", text: ("*❌ Failed*\n" + $failed + " / " + $total) },
                    { type: "mrkdwn", text: ("*⏭ Skipped*\n" + $skipped + " / " + $total) },
                    { type: "mrkdwn", text: ("*⏱ Duration*\n" + $duration) }
                  ]
                },
                {
                  type: "section",
                  fields: [
                    { type: "mrkdwn", text: ("*Environment*\n`" + $env + "`") },
                    { type: "mrkdwn", text: ("*Browser*\n`" + $browser + "`") },
                    { type: "mrkdwn", text: ("*Branch*\n`" + $branch + "`") },
                    { type: "mrkdwn", text: ("*Triggered by*\n" + $actor + " via " + $event) },
                    { type: "mrkdwn", text: ("*Shards*\n" + $shards) }
                  ]
                },
                {
                  type: "actions",
                  elements: [
                    {
                      type: "button",
                      style: $btn_style,
                      text: { type: "plain_text", text: "View Run & Report" },
                      url: $run_url
                    },
                    {
                      type: "button",
                      text: { type: "plain_text", text: "View Deployed Report" },
                      url: $pages_url
                    }
                  ]
                }
              ]
            }')

          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"