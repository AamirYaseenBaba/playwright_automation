name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test-suite:
        description: 'Regex/tag to grep (e.g. "@smoke") or blank for all'
        required: false
        default: ''
      browser:
        description: 'Playwright project name (chromium, firefox, webkit)'
        required: false
        default: 'chromium'
      headless:
        description: 'Run headless (true/false). If false, uses --headed'
        required: false
        default: 'true'
      retries:
        description: 'Retries for failed tests'
        required: false
        default: '0'
      parallel:
        description: 'Workers (0 for default)'
        required: false
        default: '0'
      timeout:
        description: 'Timeout in ms'
        required: false
        default: '30000'
      report:
        description: 'Generate & publish merged HTML report (true/false)'
        required: false
        default: 'true'
      upload-artifacts:
        description: 'Upload debug artifacts on failure (true/false)'
        required: false
        default: 'true'

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

env:
  CI: true
  SHARD_TOTAL: 4

jobs:
  e2e-tests:
    name: E2E (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/slack' && 'staging' || 'Production' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host --user 1001
    steps:
      - uses: actions/checkout@v5
      
      - name: Cache npm (download cache)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install deps
        run: npm ci
      - name: Run Playwright tests (sharded)
        env:
          TEST_SUITE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test-suite || '' }}
          BROWSER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.browser || 'chromium' }}
          HEADLESS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.headless || 'true' }}
          RETRIES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.retries || '0' }}
          WORKERS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.parallel || '0' }}
          TIMEOUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.timeout || '30000' }}

          BASE_URL: ${{ secrets.BASE_URL }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          HTTP_USERNAME: ${{ secrets.HTTP_USERNAME }}
          HTTP_PASSWORD: ${{ secrets.HTTP_PASSWORD }}
        run: |
          set -euo pipefail

          args=()
          args+=(--reporter=blob)
          args+=(--shard="${{ matrix.shard }}/${SHARD_TOTAL}")
          args+=(--project="${BROWSER}")
          args+=(--retries="${RETRIES}")
          args+=(--timeout="${TIMEOUT}")

          if [ "${HEADLESS}" != "true" ]; then
            args+=(--headed)
          fi

          if [ "${WORKERS}" != "0" ]; then
            args+=(--workers="${WORKERS}")
          fi

          if [ -n "${TEST_SUITE}" ]; then
            args+=(--grep="${TEST_SUITE}")
          fi

          npx playwright test "${args[@]}"

      - name: Upload blob report (shard)
        if: always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.report == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 7

      - name: Upload debug artifacts (failure only)
        if: failure() && (github.event_name != 'workflow_dispatch' || github.event.inputs.upload-artifacts == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: pw-debug-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  merge-report:
    name: Merge HTML report
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.report == 'true')

    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host --user 1001

    steps:
      - uses: actions/checkout@v5
      
      - name: Cache npm (download cache)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install deps
        run: npm ci

      - name: Download shard blob reports
        uses: actions/download-artifact@v5
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge blob reports -> playwright-report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report--attempt-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 14

      - name: Upload Pages artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: playwright-report

      - name: Generate JSON results
        id: json-report
        if: always()
        run: |
          npx playwright merge-reports --reporter=json ./all-blob-reports > pw-results.json 2>/dev/null || echo '{}' > pw-results.json

      - name: Parse test results
        id: results
        if: always()
        run: |
          passed=$(jq '.stats.expected // 0' pw-results.json)
          failed=$(jq '.stats.unexpected // 0' pw-results.json)
          skipped=$(jq '.stats.skipped // 0' pw-results.json)
          duration_ms=$(jq '.stats.duration // 0' pw-results.json)
          duration=$(echo "$duration_ms" | awk '{printf "%dm %ds", $1/60000, ($1%60000)/1000}')
          failed_list=$(jq -r '
            [.. | objects | select(.results?) |
              select(any(.results[]; .status == "unexpected")) | .title]
            | unique
            | if length == 0 then "None" else join("\n") end
          ' pw-results.json 2>/dev/null || echo "None")
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"
          echo "duration=$duration" >> "$GITHUB_OUTPUT"
          {
            echo "failed_list<<DELIM"
            echo "$failed_list"
            echo "DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: always() && !cancelled()
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ needs.e2e-tests.result == 'success' && '✅' || '❌' }} Playwright Tests — ${{ github.ref == 'refs/heads/main' && 'staging' || 'Production' }} (${{ github.event.inputs['test-suite'] || 'all' }})"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Status:*\n${{ needs.e2e-tests.result == 'success' && 'Passed' || 'Failed' }}" },
                    { "type": "mrkdwn", "text": "*Environment:*\n${{ github.ref == 'refs/heads/main' && 'staging' || 'Production' }}" },
                    { "type": "mrkdwn", "text": "*Suite:*\n${{ github.event.inputs['test-suite'] || 'all' }}" },
                    { "type": "mrkdwn", "text": "*Browser:*\n${{ github.event.inputs.browser || 'chromium' }}" },
                    { "type": "mrkdwn", "text": "*Triggered by:*\n${{ github.actor }}" }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*✅ Passed:*\n${{ steps.results.outputs.passed }}" },
                    { "type": "mrkdwn", "text": "*❌ Failed:*\n${{ steps.results.outputs.failed }}" },
                    { "type": "mrkdwn", "text": "*⏭ Skipped:*\n${{ steps.results.outputs.skipped }}" },
                    { "type": "mrkdwn", "text": "*⏱ Duration:*\n${{ steps.results.outputs.duration }}" }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Failed Tests:*\n${{ steps.results.outputs.failed_list }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":paperclip: *Full HTML report:* Download the `html-report--attempt-${{ github.run_attempt }}` artifact from the run link below."
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "style": "${{ needs.e2e-tests.result == 'success' && 'primary' || 'danger' }}",
                      "text": { "type": "plain_text", "text": "View Run & Download Report" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

  deploy-pages:
    name: Deploy report to GitHub Pages
    runs-on: ubuntu-latest
    needs: [merge-report]
    if: always() && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || github.event.inputs.report == 'true')
    environment:
      name: github-pages

    steps:
      - uses: actions/deploy-pages@v4